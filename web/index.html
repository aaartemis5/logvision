<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionLog AI — Security Center</title>
    <!-- Modern web font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/web/style.css">
</head>

<body>

    <!-- Top Navigation -->
    <nav class="navbar">
        <div class="nav-left">
            <div class="logo">
                <i data-lucide="shield-check"></i>
                <span>VisionLog AI</span>
            </div>
            <div class="camera-selector">
                <select id="camera-select">
                    <!-- Cameras will be populated dynamically -->
                    <option value="CAM_01">Front Entrance (CAM_01)</option>
                </select>
            </div>
        </div>
        <div class="nav-right">
            <div class="status-indicator">
                <div class="pulsing-dot"></div>
                <span>SYSTEM ACTIVE</span>
            </div>
        </div>
    </nav>

    <!-- Main Application Grid -->
    <main class="app-container">

        <!-- Left Panel: Live Stream -->
        <section class="stream-panel">
            <div class="video-container glass-panel">
                <div class="video-overlay-ui">
                    <span class="badge badge-live">LIVE ANALYTICS</span>
                    <span class="badge badge-fps" id="fps-counter">30.0 FPS</span>
                </div>
                <!-- The MJPEG Feed from FastAPI -->
                <img id="live-stream-img" src="/api/camera/stream/CAM_01" alt="VisionLog Stream Loading...">
            </div>
        </section>

        <!-- Right Panel: AI Inquiry (Dual Mode) -->
        <section class="chat-panel glass-panel">
            <div class="chat-header">
                <h3><i data-lucide="bot"></i> Inquiry Center</h3>
                <div class="mode-toggles">
                    <label class="toggle-switch">
                        <input type="checkbox" id="mode-toggle" checked>
                        <span class="slider"></span>
                        <span class="label-text">Dual RAG Search</span>
                    </label>
                </div>
            </div>

            <!-- Chat message history -->
            <div class="chat-history" id="chat-history">
                <div class="message message-ai">
                    <div class="avatar"><i data-lucide="cpu"></i></div>
                    <div class="bubble">
                        <p>VisionLog AI initialized. Multi-modal indexing is active.</p>
                        <p>What would you like to investigate today?</p>
                    </div>
                </div>
            </div>

            <!-- Chat input area -->
            <div class="chat-input-area">
                <form id="chat-form">
                    <input type="text" id="chat-input" placeholder="E.g., Show me someone crouching near the shelves..."
                        autocomplete="off" required>
                    <button type="submit" id="send-btn">
                        <i data-lucide="send"></i>
                    </button>
                </form>
            </div>
        </section>

    </main>

    <!-- Video Modal Overlay -->
    <div id="video-modal" class="modal-overlay hidden">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h3><i data-lucide="video"></i> Video Evidence Review</h3>
                <button id="close-modal-btn"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body">
                <div class="modal-main-video">
                    <video id="modal-video-player" controls autoplay></video>
                    <div id="modal-video-info" class="clip-badge">Match: 100%</div>
                </div>
                <div class="modal-sidebar">
                    <h4 style="margin-bottom:12px; font-size:0.9rem; color:var(--text-secondary);">Other Matches</h4>
                    <div id="modal-sidebar-clips">
                        <!-- Additional clips injected here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- App Logic -->
    <script src="/web/app.js"></script>
</body>

</html>
